# ==========================================
# 하드코어 엔더런 (Hardcore Ender Run) 설정
# ==========================================

# 초기 지급되는 목숨 개수
limit_count: 1

# 누군가 죽었을 때 알림 여부
show_death_log: false

# 우측 스코어보드 UI 사용 여부
use_scoreboard: true

# 게임 시작 후 초반 보호 시간 (단위: 초 / 0일 경우 미사용)
protection_time: 0

# 맵 생성 시 고정 시드 사용 여부 (true일 경우 동일한 맵으로 계속 재도전)
lock_seed: false